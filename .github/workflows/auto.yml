name: Social Automation

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Packages
        run: pip install -r requirements.txt

      - name: Run Script
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
          FB_PAGE_ID_BILLIONAIRE: ${{ secrets.FB_PAGE_ID_BILLIONAIRE }}
          FB_TOKEN_BILLIONAIRE: ${{ secrets.FB_TOKEN_BILLIONAIRE }}
          FB_PAGE_ID_PERSONAL: ${{ secrets.FB_PAGE_ID_PERSONAL }}
          FB_TOKEN_PERSONAL: ${{ secrets.FB_TOKEN_PERSONAL }}
          IG_ID_BILLIONAIRE: ${{ secrets.IG_ID_BILLIONAIRE }}
          IG_TOKEN_BILLIONAIRE: ${{ secrets.IG_TOKEN_BILLIONAIRE }}
          IG_ID_PERSONAL: ${{ secrets.IG_ID_PERSONAL }}
          IG_TOKEN_PERSONAL: ${{ secrets.IG_TOKEN_PERSONAL }}
          YT_TOKEN_BILLIONAIRE: ${{ secrets.YT_TOKEN_BILLIONAIRE }}
          YT_TOKEN_PERSONAL: ${{ secrets.YT_TOKEN_PERSONAL }}
        run: python main.py